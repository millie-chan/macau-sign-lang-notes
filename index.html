<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>澳門手語標注筆記</title>
<style>
  :root {
    --bg: #fafafa;
    --card: #ffffff;
    --border: #e0e0e0;
    --text: #1a1a1a;
    --muted: #666;
    --accent: #2c6e49;
    --accent-hover: #245c3d;
    --danger: #b00020;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC",
                 "Microsoft JhengHei", sans-serif;
    margin: 0;
    padding: 24px 16px 64px;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
  }
  .container { max-width: 860px; margin: 0 auto; }
  header { margin-bottom: 32px; }
  h1 { font-size: 1.6rem; margin: 0 0 4px; }
  .subtitle { color: var(--muted); font-size: 0.9rem; margin: 0; }

  section {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 20px;
    margin-bottom: 24px;
  }
  h2 { font-size: 1.15rem; margin: 0 0 16px; }

  form { display: flex; flex-direction: column; gap: 10px; }
  input, textarea, button {
    font: inherit;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: #fff;
    color: var(--text);
    width: 100%;
  }
  input:focus, textarea:focus {
    outline: 2px solid var(--accent);
    outline-offset: -1px;
    border-color: var(--accent);
  }
  textarea { resize: vertical; min-height: 60px; }
  .time-row { display: flex; gap: 10px; }
  .time-row input { flex: 1; }
  .hint { font-size: 0.8rem; color: var(--muted); margin: -4px 0 0; }

  button {
    background: var(--accent);
    color: #fff;
    border: none;
    cursor: pointer;
    font-weight: 600;
    transition: background 0.15s;
  }
  button:hover { background: var(--accent-hover); }
  button:disabled { opacity: 0.6; cursor: not-allowed; }

  #submit-status {
    margin: 8px 0 0;
    font-size: 0.9rem;
    min-height: 1.4em;
  }
  #submit-status.ok { color: var(--accent); }
  #submit-status.err { color: var(--danger); }

  .video-card {
    border-top: 1px solid var(--border);
    padding: 16px 0;
  }
  .video-card:first-of-type { border-top: none; padding-top: 0; }
  .video-card h3 { font-size: 1rem; margin: 0 0 4px; }
  .video-card a {
    color: var(--accent);
    text-decoration: none;
    font-size: 0.85rem;
    word-break: break-all;
  }
  .video-card a:hover { text-decoration: underline; }
  .video-card ul {
    list-style: none;
    padding: 0;
    margin: 12px 0 0;
  }
  .video-card li {
    padding: 6px 0;
    border-bottom: 1px dashed var(--border);
    display: flex;
    align-items: baseline;
    gap: 8px;
    flex-wrap: wrap;
    font-size: 0.92rem;
  }
  .video-card li:last-child { border-bottom: none; }
  .video-card strong { color: var(--accent); }
  .time {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 0.8rem;
    color: var(--muted);
    background: #f0f0f0;
    padding: 1px 6px;
    border-radius: 4px;
  }
  .notes { color: var(--muted); font-size: 0.85rem; }
  .conf { font-size: 0.75rem; color: var(--muted); }

  .empty { color: var(--muted); font-style: italic; }
  #search-input { margin-bottom: 16px; }

  footer {
    text-align: center;
    color: var(--muted);
    font-size: 0.8rem;
    margin-top: 32px;
  }
</style>
</head>
<body>
<div class="container">

  <header>
    <h1>澳門手語標注筆記</h1>
    <p class="subtitle">澳門手語標注筆記 · 階段一 MVP</p>
  </header>

  <section id="submit-section">
    <h2>新增標注</h2>
    <form id="annotation-form">
      <input type="url" id="video-url" placeholder="YouTube 影片網址，例如 https://www.youtube.com/watch?v=xxxxxxxxxxx" required>
      <input type="text" id="video-title" placeholder="影片標題" required>

      <div class="time-row">
        <input type="text" id="start-input" placeholder="開始時間，例如 1:23 或 1:02:03" required>
        <input type="text" id="end-input" placeholder="結束時間（可空），例如 1:25">
      </div>
      <p class="hint">格式：分:秒（1:23）或 時:分:秒（1:02:03）。純數字視為秒數（83 = 1:23）。</p>

      <input type="text" id="label" placeholder="單詞意思，例如：謝謝" required>
      <input type="number" id="confidence" placeholder="信心度 1–5（可空）" min="1" max="5">
      <textarea id="notes" placeholder="備註（可空）"></textarea>

      <div style="display:flex; gap:8px;">
        <button type="submit" id="submit-btn" style="flex:2;">提交標注</button>
        <button type="button" id="clear-video-btn" style="flex:1; background:#888;">清除影片資訊</button>
      </div>
    </form>
    <p id="submit-status"></p>
  </section>

  <section id="list-section">
    <h2>所有標注</h2>
    <input type="text" id="search-input" placeholder="按網址、標題或單詞搜尋…">
    <div id="annotation-list">
      <p class="empty">載入中…</p>
    </div>
  </section>

  <footer>
    <p>資料以 CC0 釋出 · 開源於 GitHub</p>
  </footer>

</div>

<script type="module">
import { SUPABASE_URL, SUPABASE_ANON_KEY } from './config.js';
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

// ---------- 配置檢查 ----------

const configError =
  !SUPABASE_URL || !SUPABASE_URL.startsWith('https://')
    ? 'SUPABASE_URL 必須是 https:// 開頭的完整網址'
  : !SUPABASE_ANON_KEY || SUPABASE_ANON_KEY === 'YOUR_ANON_KEY'
    ? 'SUPABASE_ANON_KEY 尚未填寫'
  : null;

if (configError) {
  document.getElementById('annotation-list').innerHTML =
    `<p class="empty">配置錯誤：${configError}。請修改 config.js 後強制重新整理（Ctrl+Shift+R / Cmd+Shift+R）。</p>`;
} else {
  main(createClient(SUPABASE_URL, SUPABASE_ANON_KEY));
}

// ---------- 工具函式（不依賴 supabase） ----------

function extractVideoId(url) {
  const regex = /(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|v\/|shorts\/))([A-Za-z0-9_-]{11})/;
  const match = url.match(regex);
  return match ? match[1] : null;
}

function normalizeUrl(videoId) {
  return `https://www.youtube.com/watch?v=${videoId}`;
}

// 把 "1:23" / "1:02:03" / "83" 轉成毫秒；解析失敗回傳 NaN
function parseTimeToMs(input) {
  const s = String(input).trim();
  if (!s) return NaN;

  // 純數字：視為秒數，允許小數
  if (/^\d+(\.\d+)?$/.test(s)) {
    return Math.round(parseFloat(s) * 1000);
  }

  // 分:秒 或 時:分:秒
  const parts = s.split(':');
  if (parts.length < 2 || parts.length > 3) return NaN;

  let total = 0;
  for (const part of parts) {
    if (!/^\d+$/.test(part)) return NaN;  // 每段必須是整數
    total = total * 60 + parseInt(part, 10);
  }
  return total * 1000;
}

// 毫秒轉回 m:ss 或 h:mm:ss，供顯示
function formatMs(ms) {
  const totalSec = Math.floor(ms / 1000);
  const h = Math.floor(totalSec / 3600);
  const m = Math.floor((totalSec % 3600) / 60);
  const s = totalSec % 60;
  if (h > 0) {
    return `${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
  }
  return `${m}:${String(s).padStart(2, '0')}`;
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = String(str);
  return div.innerHTML;
}

// ---------- 主邏輯（依賴 supabase） ----------

function main(supabase) {
  const form = document.getElementById('annotation-form');
  const statusEl = document.getElementById('submit-status');
  const submitBtn = document.getElementById('submit-btn');
  const listEl = document.getElementById('annotation-list');
  const searchEl = document.getElementById('search-input');

  let allAnnotations = [];

  function setStatus(msg, type) {
    statusEl.textContent = msg;
    statusEl.className = type || '';
  }

  document.getElementById('clear-video-btn').addEventListener('click', () => {
    document.getElementById('video-url').value = '';
    document.getElementById('video-title').value = '';
  });
  
  // 提交
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    setStatus('提交中…');

    const rawUrl = document.getElementById('video-url').value.trim();
    const videoId = extractVideoId(rawUrl);
    if (!videoId) {
      setStatus('網址格式不正確，只接受 YouTube 連結。', 'err');
      return;
    }

    const startMs = parseTimeToMs(document.getElementById('start-input').value);
    if (isNaN(startMs)) {
      setStatus('開始時間格式不正確，請用 1:23 這種格式。', 'err');
      return;
    }

    const endInput = document.getElementById('end-input').value.trim();
    let endMs = null;
    if (endInput) {
      endMs = parseTimeToMs(endInput);
      if (isNaN(endMs)) {
        setStatus('結束時間格式不正確，請用 1:25 這種格式，或留空。', 'err');
        return;
      }
      if (endMs < startMs) {
        setStatus('結束時間不能早於開始時間。', 'err');
        return;
      }
    }

    const confidenceRaw = document.getElementById('confidence').value.trim();
    const notesRaw = document.getElementById('notes').value.trim();

    const payload = {
      video_id: videoId,
      video_url: normalizeUrl(videoId),
      video_title: document.getElementById('video-title').value.trim(),
      start_ms: startMs,
      end_ms: endMs,
      label: document.getElementById('label').value.trim(),
      confidence: confidenceRaw ? Number(confidenceRaw) : null,
      notes: notesRaw || null,
    };

    submitBtn.disabled = true;
    const { error } = await supabase.from('annotations').insert(payload);
    submitBtn.disabled = false;

    if (error) {
      setStatus(`提交失敗：${error.message}`, 'err');
      return;
    }

    setStatus('提交成功。', 'ok');
    document.getElementById('start-input').value = '';
    document.getElementById('end-input').value = '';
    document.getElementById('label').value = '';
    document.getElementById('confidence').value = '';
    document.getElementById('notes').value = '';
    // 保留 video-url 和 video-title，方便同影片連續標注
    loadAnnotations();
  });

  // 列表與查詢
  async function loadAnnotations() {
    const { data, error } = await supabase
      .from('annotations')
      .select('*')
      .order('created_at', { ascending: false });

    if (error) {
      listEl.innerHTML = `<p class="empty">載入失敗：${escapeHtml(error.message)}</p>`;
      return;
    }
    allAnnotations = data || [];
    renderList(allAnnotations);
  }

  function renderList(annotations) {
    if (!annotations.length) {
      listEl.innerHTML = '<p class="empty">還沒有任何標注。</p>';
      return;
    }

    const grouped = new Map();
    for (const a of annotations) {
      if (!grouped.has(a.video_id)) grouped.set(a.video_id, []);
      grouped.get(a.video_id).push(a);
    }

    const html = [];
    for (const [videoId, items] of grouped) {
      items.sort((x, y) => x.start_ms - y.start_ms);
      const first = items[0];

      const itemHtml = items.map(item => {
        const timeStr = item.end_ms
          ? `${formatMs(item.start_ms)} – ${formatMs(item.end_ms)}`
          : formatMs(item.start_ms);
        const confStr = item.confidence
          ? `<span class="conf">信心 ${item.confidence}/5</span>`
          : '';
        const notesStr = item.notes
          ? `<span class="notes">${escapeHtml(item.notes)}</span>`
          : '';
        return `
          <li>
            <strong>${escapeHtml(item.label)}</strong>
            <span class="time">${timeStr}</span>
            ${confStr}
            ${notesStr}
          </li>
        `;
      }).join('');

      html.push(`
        <div class="video-card">
          <h3>${escapeHtml(first.video_title)}</h3>
          <a href="${escapeHtml(first.video_url)}" target="_blank" rel="noopener">
            ${escapeHtml(first.video_url)}
          </a>
          <ul>${itemHtml}</ul>
        </div>
      `);
    }
    listEl.innerHTML = html.join('');
  }

  searchEl.addEventListener('input', () => {
    const q = searchEl.value.trim().toLowerCase();
    if (!q) {
      renderList(allAnnotations);
      return;
    }
    const filtered = allAnnotations.filter(a =>
      a.video_url.toLowerCase().includes(q) ||
      a.video_title.toLowerCase().includes(q) ||
      a.label.toLowerCase().includes(q)
    );
    renderList(filtered);
  });

  // 啟動
  loadAnnotations();
}
</script>
</body>
</html>
