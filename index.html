<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>澳門手語標注筆記</title>
<style>
  :root {
    --bg: #fafafa;
    --card: #ffffff;
    --border: #e0e0e0;
    --text: #1a1a1a;
    --muted: #666;
    --accent: #2c6e49;
    --accent-hover: #245c3d;
    --danger: #b00020;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC",
                 "Microsoft JhengHei", sans-serif;
    margin: 0;
    padding: 24px 16px 64px;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
  }
  .container { max-width: 900px; margin: 0 auto; }
  header { margin-bottom: 24px; }
  h1 { font-size: 1.6rem; margin: 0 0 4px; }
  .subtitle { color: var(--muted); font-size: 0.9rem; margin: 0; }

  section {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 20px;
    margin-bottom: 20px;
  }
  h2 { font-size: 1.15rem; margin: 0 0 16px; }
  h3 { font-size: 1rem; margin: 16px 0 8px; color: var(--muted); }

  input, textarea, button {
    font: inherit;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: #fff;
    color: var(--text);
    width: 100%;
  }
  input:focus, textarea:focus {
    outline: 2px solid var(--accent);
    outline-offset: -1px;
    border-color: var(--accent);
  }
  textarea { resize: vertical; min-height: 60px; }

  button {
    background: var(--accent);
    color: #fff;
    border: none;
    cursor: pointer;
    font-weight: 600;
    transition: background 0.15s;
    width: auto;
  }
  button:hover { background: var(--accent-hover); }
  button:disabled { opacity: 0.6; cursor: not-allowed; }

  /* 影片區 */
  .video-inputs { display: flex; flex-direction: column; gap: 8px; }
  .url-row { display: flex; gap: 8px; }
  .url-row input { flex: 1; }
  .url-row button { padding: 8px 16px; flex-shrink: 0; }

  .player-wrapper {
    margin-top: 12px;
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #000;
    border-radius: 8px;
    overflow: hidden;
    display: none;
  }
  .player-wrapper.active { display: block; }
  .player-wrapper #yt-player,
  .player-wrapper #yt-player iframe {
    width: 100% !important;
    height: 100% !important;
    border: none;
    display: block;
  }

  /* 多行標注 */
  .annotation-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    padding: 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: #f9f9f9;
    margin-bottom: 8px;
  }
  .annotation-row .time-group {
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .annotation-row .time-group label {
    font-size: 0.85rem;
    color: var(--muted);
    white-space: nowrap;
  }
  .annotation-row .start-input,
  .annotation-row .end-input {
    width: 70px;
    padding: 6px 8px;
  }
  .annotation-row .capture-btn {
    padding: 5px 8px;
    font-size: 0.9rem;
    background: #e0e0e0;
    color: var(--text);
    width: auto;
  }
  .annotation-row .capture-btn:hover {
    background: var(--accent);
    color: #fff;
  }
  .annotation-row .label-group {
    display: flex;
    align-items: center;
    gap: 4px;
    flex: 1 1 160px;
    min-width: 140px;
  }
  .annotation-row .label-input {
    flex: 1;
    padding: 6px 8px;
  }
  .annotation-row .remove-row-btn {
    padding: 6px 10px;
    background: transparent;
    color: var(--danger);
    border: 1px solid var(--border);
    width: auto;
  }
  .annotation-row .remove-row-btn:hover {
    background: var(--danger);
    color: #fff;
  }

  .action-row { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .action-row #add-row-btn { background: #888; flex: 1 1 120px; }
  .action-row #add-row-btn:hover { background: #666; }
  .action-row #submit-all-btn { flex: 2 1 200px; }

  #submit-status {
    margin: 12px 0 0;
    font-size: 0.9rem;
    min-height: 1.4em;
  }
  #submit-status.ok { color: var(--accent); }
  #submit-status.err { color: var(--danger); }

  /* 現有標注清單 */
  .current-annotations {
    margin-top: 12px;
    padding: 12px;
    background: #f5f9f6;
    border-radius: 6px;
    border: 1px solid #d4e4d9;
  }
  .current-annotations ul {
    list-style: none;
    padding: 0;
    margin: 0;
  }
  .current-annotations li {
    padding: 4px 0;
    display: flex;
    align-items: baseline;
    gap: 8px;
    flex-wrap: wrap;
    font-size: 0.9rem;
  }

  .video-card {
    border-top: 1px solid var(--border);
    padding: 16px 0;
  }
  .video-card:first-of-type { border-top: none; padding-top: 0; }
  .video-card h3 { font-size: 1rem; margin: 0 0 4px; color: var(--text); }
  .video-card a {
    color: var(--accent);
    text-decoration: none;
    font-size: 0.85rem;
    word-break: break-all;
  }
  .video-card a:hover { text-decoration: underline; }
  .video-card ul {
    list-style: none;
    padding: 0;
    margin: 12px 0 0;
  }
  .video-card li {
    padding: 6px 0;
    border-bottom: 1px dashed var(--border);
    display: flex;
    align-items: baseline;
    gap: 8px;
    flex-wrap: wrap;
    font-size: 0.92rem;
  }
  .video-card li:last-child { border-bottom: none; }
  .video-card strong { color: var(--accent); }
  .time {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 0.8rem;
    color: var(--muted);
    background: #f0f0f0;
    padding: 1px 6px;
    border-radius: 4px;
  }
  .notes { color: var(--muted); font-size: 0.85rem; }
  .conf { font-size: 0.75rem; color: var(--muted); }
  .standard { font-size: 0.7rem; color: var(--accent); }

  .hint { font-size: 0.8rem; color: var(--muted); margin: -4px 0 0; }
  .empty { color: var(--muted); font-style: italic; }
  #search-input { margin-bottom: 16px; }

  footer {
    text-align: center;
    color: var(--muted);
    font-size: 0.8rem;
    margin-top: 32px;
  }
</style>
</head>
<body>
<div class="container">

  <header>
    <h1>澳門手語標注筆記</h1>
    <p class="subtitle">階段二 B · 播放器 + 多詞提交</p>
  </header>

  <!-- 影片區 -->
  <section id="video-section">
    <h2>影片</h2>
    <div class="video-inputs">
      <div class="url-row">
        <input type="url" id="video-url" placeholder="YouTube 影片網址" autocomplete="off">
        <button type="button" id="load-video-btn">載入影片</button>
      </div>
      <input type="text" id="video-title" placeholder="影片標題（載入後可自動抓取，也可手動修改）">
    </div>

    <div class="player-wrapper" id="player-wrapper">
      <div id="yt-player"></div>
    </div>

    <div id="current-annotations-container"></div>
  </section>

  <!-- 多行標注 -->
  <section id="annotations-section">
    <h2>新增標注</h2>
    <p class="hint">
      點 ⏱ 抓取播放器當前時間。焦點不在輸入框時，按空白鍵可暫停/播放。
    </p>

    <div id="annotation-rows"></div>

    <div class="action-row">
      <button type="button" id="add-row-btn">+ 新增一行</button>
      <button type="button" id="submit-all-btn">提交所有標注</button>
    </div>

    <p id="submit-status"></p>
  </section>

  <!-- 所有標注 -->
  <section id="list-section">
    <h2>所有標注</h2>
    <input type="text" id="search-input" placeholder="按網址、標題或單詞搜尋…">
    <div id="annotation-list">
      <p class="empty">載入中…</p>
    </div>
  </section>

  <footer>
    <p>資料以 CC0 釋出 · 開源於 GitHub</p>
  </footer>

</div>

<datalist id="vocab-list"></datalist>

<script type="module">
import { SUPABASE_URL, SUPABASE_ANON_KEY } from './config.js';
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

// ---------- 配置檢查 ----------

const configError =
  !SUPABASE_URL || !SUPABASE_URL.startsWith('https://')
    ? 'SUPABASE_URL 必須是 https:// 開頭的完整網址'
  : !SUPABASE_ANON_KEY || SUPABASE_ANON_KEY === 'YOUR_ANON_KEY'
    ? 'SUPABASE_ANON_KEY 尚未填寫'
  : null;

if (configError) {
  document.getElementById('annotation-list').innerHTML =
    `<p class="empty">配置錯誤：${configError}。請修改 config.js 後強制重新整理（Ctrl+Shift+R / Cmd+Shift+R）。</p>`;
} else {
  main(createClient(SUPABASE_URL, SUPABASE_ANON_KEY));
}

// ---------- 工具函式 ----------

function extractVideoId(url) {
  const regex = /(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|v\/|shorts\/))([A-Za-z0-9_-]{11})/;
  const m = url.match(regex);
  return m ? m[1] : null;
}

function normalizeUrl(videoId) {
  return `https://www.youtube.com/watch?v=${videoId}`;
}

function parseTimeToMs(input) {
  const s = String(input).trim();
  if (!s) return NaN;
  if (/^\d+(\.\d+)?$/.test(s)) {
    return Math.round(parseFloat(s) * 1000);
  }
  const parts = s.split(':');
  if (parts.length < 2 || parts.length > 3) return NaN;
  let total = 0;
  for (const part of parts) {
    if (!/^\d+$/.test(part)) return NaN;
    total = total * 60 + parseInt(part, 10);
  }
  return total * 1000;
}

function formatMs(ms) {
  const totalSec = Math.floor(ms / 1000);
  const h = Math.floor(totalSec / 3600);
  const m = Math.floor((totalSec % 3600) / 60);
  const s = totalSec % 60;
  if (h > 0) {
    return `${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
  }
  return `${m}:${String(s).padStart(2, '0')}`;
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = String(str);
  return div.innerHTML;
}

// ---------- 詞彙庫 ----------

let vocabSet = new Set();

async function loadVocab() {
  const datalist = document.getElementById('vocab-list');
  try {
    const res = await fetch('./vocab.json', { cache: 'no-store' });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const words = await res.json();
    if (!Array.isArray(words)) throw new Error('vocab.json 必須是字符串數組');
    vocabSet = new Set(words);
    datalist.innerHTML = words.map(w => `<option value="${escapeHtml(w)}"></option>`).join('');
  } catch (err) {
    console.warn('詞彙庫載入失敗：', err.message);
  }
}

// ---------- YouTube API ----------

let ytApiLoaded = false;
let ytApiReadyResolve = null;
const ytApiReady = new Promise(resolve => { ytApiReadyResolve = resolve; });

function loadYTApi() {
  if (ytApiLoaded) return;
  ytApiLoaded = true;

  window.onYouTubeIframeAPIReady = () => {
    ytApiReadyResolve();
  };

  const tag = document.createElement('script');
  tag.src = 'https://www.youtube.com/iframe_api';
  document.head.appendChild(tag);
}

async function fetchVideoTitle(videoId) {
  try {
    const res = await fetch(
      `https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=${videoId}&format=json`
    );
    if (!res.ok) return null;
    const data = await res.json();
    return data.title || null;
  } catch {
    return null;
  }
}

// ---------- 主邏輯 ----------

function main(supabase) {
  // 狀態
  let player = null;
  let playerReady = false;
  let currentVideoId = null;

  // DOM
  const videoUrlInput = document.getElementById('video-url');
  const videoTitleInput = document.getElementById('video-title');
  const loadBtn = document.getElementById('load-video-btn');
  const playerWrapper = document.getElementById('player-wrapper');
  const currentAnnoContainer = document.getElementById('current-annotations-container');
  const rowsContainer = document.getElementById('annotation-rows');
  const addRowBtn = document.getElementById('add-row-btn');
  const submitAllBtn = document.getElementById('submit-all-btn');
  const statusEl = document.getElementById('submit-status');
  const listEl = document.getElementById('annotation-list');
  const searchEl = document.getElementById('search-input');

  let allAnnotations = [];

  // ---------- 狀態工具 ----------

  function setStatus(msg, type) {
    statusEl.textContent = msg;
    statusEl.className = type || '';
  }

  // ---------- 行管理 ----------

  function createRow() {
    const row = document.createElement('div');
    row.className = 'annotation-row';

    const startGroup = document.createElement('div');
    startGroup.className = 'time-group';
    startGroup.innerHTML = `
      <label>開始</label>
      <input type="text" class="start-input" placeholder="0:00" autocomplete="off">
      <button type="button" class="capture-btn" title="抓取當前播放時間">⏱</button>
    `;

    const endGroup = document.createElement('div');
    endGroup.className = 'time-group';
    endGroup.innerHTML = `
      <label>結束</label>
      <input type="text" class="end-input" placeholder="0:00" autocomplete="off">
      <button type="button" class="capture-btn" title="抓取當前播放時間">⏱</button>
    `;

    const labelGroup = document.createElement('div');
    labelGroup.className = 'label-group';
    labelGroup.innerHTML = `
      <input type="text" class="label-input" list="vocab-list"
             placeholder="單詞意思" autocomplete="off">
    `;

    const removeBtn = document.createElement('button');
    removeBtn.type = 'button';
    removeBtn.className = 'remove-row-btn';
    removeBtn.title = '移除';
    removeBtn.textContent = '✕';

    // 抓時間
    startGroup.querySelector('.capture-btn').addEventListener('click', () => {
      captureTime(startGroup.querySelector('.start-input'));
    });
    endGroup.querySelector('.capture-btn').addEventListener('click', () => {
      captureTime(endGroup.querySelector('.end-input'));
    });

    // 移除行
    removeBtn.addEventListener('click', () => {
      const total = rowsContainer.querySelectorAll('.annotation-row').length;
      if (total > 1) {
        row.remove();
      } else {
        row.querySelectorAll('input').forEach(inp => inp.value = '');
      }
    });

    row.appendChild(startGroup);
    row.appendChild(endGroup);
    row.appendChild(labelGroup);
    row.appendChild(removeBtn);
    return row;
  }

  function resetRows() {
    rowsContainer.innerHTML = '';
    rowsContainer.appendChild(createRow());
    const firstInput = rowsContainer.querySelector('.start-input');
    if (firstInput) firstInput.focus();
  }

  function captureTime(targetInput) {
    if (!player || !playerReady) {
      setStatus('請先載入影片。', 'err');
      return;
    }
    try {
      const seconds = player.getCurrentTime();
      targetInput.value = formatMs(Math.round(seconds * 1000));
    } catch {
      setStatus('無法讀取播放時間。', 'err');
    }
  }

  // ---------- 影片載入 ----------

  async function ensurePlayer(videoId) {
    await ytApiReady;

    if (!player) {
      return new Promise((resolve, reject) => {
        player = new YT.Player('yt-player', {
          videoId,
          width: '100%',
          height: '100%',
          playerVars: { playsinline: 1 },
          events: {
            onReady: () => {
              playerReady = true;
              resolve();
            },
            onError: (e) => reject(new Error('YouTube 播放器錯誤：' + e.data)),
          },
        });
      });
    }

    if (!playerReady) {
      await new Promise(resolve => {
        const check = setInterval(() => {
          if (playerReady) {
            clearInterval(check);
            resolve();
          }
        }, 100);
      });
    }

    player.loadVideoById(videoId);
  }

  loadBtn.addEventListener('click', async () => {
    const rawUrl = videoUrlInput.value.trim();
    const videoId = extractVideoId(rawUrl);
    if (!videoId) {
      setStatus('網址格式不正確，只接受 YouTube 連結。', 'err');
      return;
    }

    const isNewVideo = videoId !== currentVideoId;

    loadBtn.disabled = true;
    loadBtn.textContent = '載入中…';
    setStatus('載入影片中…');

    try {
      loadYTApi();
      await ensurePlayer(videoId);
      currentVideoId = videoId;
      playerWrapper.classList.add('active');

      // 標題：若空則嘗試自動抓
      if (!videoTitleInput.value.trim()) {
        const autoTitle = await fetchVideoTitle(videoId);
        if (autoTitle) videoTitleInput.value = autoTitle;
      }

      // 換影片才重設行
      if (isNewVideo) {
        resetRows();
      }

      setStatus('影片已載入。', 'ok');
      await loadCurrentVideoAnnotations();
    } catch (err) {
      setStatus(`載入失敗：${err.message}`, 'err');
    } finally {
      loadBtn.disabled = false;
      loadBtn.textContent = '載入影片';
    }
  });

  // ---------- 提交所有行 ----------

  submitAllBtn.addEventListener('click', async () => {
    if (!currentVideoId) {
      setStatus('請先載入影片。', 'err');
      return;
    }
    const titleValue = videoTitleInput.value.trim();
    if (!titleValue) {
      setStatus('請填寫影片標題。', 'err');
      return;
    }

    const rows = Array.from(rowsContainer.querySelectorAll('.annotation-row'));
    const payloads = [];
    const errors = [];

    rows.forEach((row, i) => {
      const rowNum = i + 1;
      const startStr = row.querySelector('.start-input').value.trim();
      const endStr = row.querySelector('.end-input').value.trim();
      const labelStr = row.querySelector('.label-input').value.trim();

      // 全空的行跳過
      if (!startStr && !labelStr) return;

      if (!startStr) { errors.push(`第 ${rowNum} 行缺少開始時間`); return; }
      if (!labelStr) { errors.push(`第 ${rowNum} 行缺少單詞`); return; }

      const startMs = parseTimeToMs(startStr);
      if (isNaN(startMs)) { errors.push(`第 ${rowNum} 行開始時間格式錯誤`); return; }

      let endMs = null;
      if (endStr) {
        endMs = parseTimeToMs(endStr);
        if (isNaN(endMs)) { errors.push(`第 ${rowNum} 行結束時間格式錯誤`); return; }
        if (endMs < startMs) { errors.push(`第 ${rowNum} 行結束時間早於開始時間`); return; }
      }

      const isStandard = vocabSet.has(labelStr);
      payloads.push({
        video_id: currentVideoId,
        video_url: normalizeUrl(currentVideoId),
        video_title: titleValue,
        start_ms: startMs,
        end_ms: endMs,
        label: labelStr,
        gloss: isStandard ? labelStr : null,
      });
    });

    if (errors.length) {
      setStatus(errors.join('；'), 'err');
      return;
    }
    if (payloads.length === 0) {
      setStatus('沒有可提交的標注。', 'err');
      return;
    }

    submitAllBtn.disabled = true;
    setStatus(`提交 ${payloads.length} 條標注中…`);

    const { error } = await supabase.from('annotations').insert(payloads);
    submitAllBtn.disabled = false;

    if (error) {
      setStatus(`提交失敗：${error.message}`, 'err');
      return;
    }

    setStatus(`成功提交 ${payloads.length} 條標注。`, 'ok');
    resetRows();
    await loadCurrentVideoAnnotations();
    await loadAllAnnotations();
  });

  // ---------- 該影片現有標注 ----------

  async function loadCurrentVideoAnnotations() {
    if (!currentVideoId) {
      currentAnnoContainer.innerHTML = '';
      return;
    }
    const { data, error } = await supabase
      .from('annotations')
      .select('*')
      .eq('video_id', currentVideoId)
      .order('start_ms', { ascending: true });

    if (error) {
      currentAnnoContainer.innerHTML =
        `<p class="empty">該影片標注載入失敗：${escapeHtml(error.message)}</p>`;
      return;
    }

    if (!data || !data.length) {
      currentAnnoContainer.innerHTML =
        '<div class="current-annotations"><strong>該影片現有標注</strong><p class="empty">暫無標注</p></div>';
      return;
    }

    const items = data.map(item => {
      const timeStr = item.end_ms
        ? `${formatMs(item.start_ms)} – ${formatMs(item.end_ms)}`
        : formatMs(item.start_ms);
      return `
        <li>
          <span class="time">${timeStr}</span>
          <strong>${escapeHtml(item.label)}</strong>
          ${item.gloss ? '<span class="standard">標準詞</span>' : ''}
        </li>
      `;
    }).join('');

    currentAnnoContainer.innerHTML = `
      <div class="current-annotations">
        <strong>該影片現有標注（${data.length} 條）</strong>
        <ul>${items}</ul>
      </div>
    `;
  }

  // ---------- 所有標注列表 ----------

  async function loadAllAnnotations() {
    const { data, error } = await supabase
      .from('annotations')
      .select('*')
      .order('created_at', { ascending: false });

    if (error) {
      listEl.innerHTML = `<p class="empty">載入失敗：${escapeHtml(error.message)}</p>`;
      return;
    }
    allAnnotations = data || [];
    renderList(allAnnotations);
  }

  function renderList(annotations) {
    if (!annotations.length) {
      listEl.innerHTML = '<p class="empty">還沒有任何標注。</p>';
      return;
    }

    const grouped = new Map();
    for (const a of annotations) {
      if (!grouped.has(a.video_id)) grouped.set(a.video_id, []);
      grouped.get(a.video_id).push(a);
    }

    const html = [];
    for (const [, items] of grouped) {
      items.sort((x, y) => x.start_ms - y.start_ms);
      const first = items[0];

      const itemHtml = items.map(item => {
        const timeStr = item.end_ms
          ? `${formatMs(item.start_ms)} – ${formatMs(item.end_ms)}`
          : formatMs(item.start_ms);
        const confStr = item.confidence
          ? `<span class="conf">信心 ${item.confidence}/5</span>` : '';
        const notesStr = item.notes
          ? `<span class="notes">${escapeHtml(item.notes)}</span>` : '';
        const standardStr = item.gloss
          ? '<span class="standard">標準詞</span>' : '';
        return `
          <li>
            <strong>${escapeHtml(item.label)}</strong>
            <span class="time">${timeStr}</span>
            ${standardStr}
            ${confStr}
            ${notesStr}
          </li>
        `;
      }).join('');

      html.push(`
        <div class="video-card">
          <h3>${escapeHtml(first.video_title)}</h3>
          <a href="${escapeHtml(first.video_url)}" target="_blank" rel="noopener">
            ${escapeHtml(first.video_url)}
          </a>
          <ul>${itemHtml}</ul>
        </div>
      `);
    }
    listEl.innerHTML = html.join('');
  }

  searchEl.addEventListener('input', () => {
    const q = searchEl.value.trim().toLowerCase();
    if (!q) {
      renderList(allAnnotations);
      return;
    }
    const filtered = allAnnotations.filter(a =>
      a.video_url.toLowerCase().includes(q) ||
      a.video_title.toLowerCase().includes(q) ||
      a.label.toLowerCase().includes(q)
    );
    renderList(filtered);
  });

  // ---------- 新增行按鈕 ----------

  addRowBtn.addEventListener('click', () => {
    const row = createRow();
    rowsContainer.appendChild(row);
    row.querySelector('.start-input').focus();
  });

  // ---------- 空白鍵暫停/播放 ----------

  document.addEventListener('keydown', (e) => {
    if (e.code !== 'Space') return;
    const tag = e.target.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA' || e.target.isContentEditable) return;
    if (!player || !playerReady) return;

    e.preventDefault();
    try {
      const state = player.getPlayerState();
      if (state === YT.PlayerState.PLAYING) {
        player.pauseVideo();
      } else {
        player.playVideo();
      }
    } catch {}
  });

  // ---------- 啟動 ----------

  resetRows();
  loadVocab();
  loadAllAnnotations();
}
</script>
</body>
</html>
